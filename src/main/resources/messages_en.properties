# DEC-079: contextual help (?) texts (help-system.md)
help.button=Help
help.page.dashboard.title=Dashboard
help.page.dashboard.body=Overview of company finances: profit and loss, cash flow, bank balances, open invoices and bills, inventory value. Each card links to the related report or list. Figures are computed live from the general ledger.
help.page.invoices.title=Invoices
help.page.invoices.body=Credit sales documents. Posting an invoice records income and the customer balance (AR), and item lines leave the warehouse. Payment is received with a separate Payment document and allocated to open invoices.
help.page.salesReceipts.title=Sales receipts
help.page.salesReceipts.body=Sale and payment in one document: money goes straight to a bank or cash account, no customer balance is tracked. For credit sales use an invoice. A posted receipt cannot be edited - corrections are made by reversal.
help.page.creditMemos.title=Credit memos
help.page.creditMemos.body=Document for returned goods or a cancelled sale: income decreases and goods return to the warehouse. The resulting credit is applied to the customer's open invoices or stays as a prepayment.
help.page.refundReceipts.title=Refund receipts
help.page.refundReceipts.body=Immediate refund to the customer: money leaves a bank or cash account, income decreases, goods return to the warehouse. Unlike a credit memo, the customer balance is untouched - money is returned right away.
help.page.estimates.title=Estimates
help.page.estimates.body=A price quote sent to the customer. It does not affect the ledger or the warehouse - a document flow only. When accepted, it converts to an invoice in one step.
help.page.invoicePayments.title=Customer payments
help.page.invoicePayments.body=Documents for receiving money from customers. A payment is allocated to open invoices; any excess stays as a prepayment. In foreign currency, the difference between document and payment rates is posted automatically as an exchange difference.
help.page.arAging.title=AR aging
help.page.arAging.body=Open customer balances grouped by how overdue they are: current and overdue buckets. Age is counted from the invoice due date. All amounts are in the home currency.
help.page.bills.title=Bills
help.page.bills.body=Credit purchase documents. Posting a bill records an expense or inventory receipt and the supplier balance (AP). Payment is made with a separate Payment document.
help.page.payments.title=Supplier payments
help.page.payments.body=Documents for paying suppliers. A payment is allocated to open bills; any excess stays as a prepayment. In foreign currency the exchange difference is posted automatically.
help.page.purchaseOrders.title=Purchase orders
help.page.purchaseOrders.body=An order sent to the supplier (PO). It does not affect the ledger or the warehouse - when goods arrive it converts to a bill. A converted order is closed and cannot be reused.
help.page.vendorCredits.title=Vendor credits
help.page.vendorCredits.body=Document for returning goods to the supplier or reducing a purchase: the supplier balance decreases and goods leave the warehouse. The credit is applied to open bills.
help.page.landedCosts.title=Landed cost allocations
help.page.landedCosts.body=Distributes extra costs such as delivery or customs into the cost of received goods. The amount is split across selected receipts in proportion to their value: the part still in stock increases inventory value, the sold part goes to COGS.
help.page.apAging.title=AP aging
help.page.apAging.body=Open supplier balances grouped by how overdue they are: current and overdue buckets. Age is counted from the bill due date. All amounts are in the home currency.
help.page.expenses.title=Expenses
help.page.expenses.body=Direct spending from a bank or cash account: the document posts on creation, and each line selects an expense account. No supplier balance is tracked - for credit purchases use a bill.
help.page.bankTransactions.title=Bank transactions
help.page.bankTransactions.body=Bank and cash activity: deposits, expenses and transfers in one list. A document posts on creation; corrections are made by reversal. A deposit can have several lines, each with its own source account.
help.page.transfers.title=Transfers
help.page.transfers.body=Moving money between two accounts: bank to cash, account to account. If currencies differ, both side amounts are entered - the difference goes to the exchange difference account. The document posts immediately; corrections by reversal.
help.page.reconciliations.title=Bank reconciliation
help.page.reconciliations.body=Matching the bank statement against ledger records. Enter the statement period and closing balance, then tick ledger lines one by one; the period completes when the difference reaches zero. A completed reconciliation cannot be changed.
help.page.warehouses.title=Warehouses
help.page.warehouses.body=Warehouse catalog: every receipt and issue is recorded against a specific warehouse, and balances and cost are tracked per warehouse. A warehouse cannot be deleted - only deactivated, its history remains.
help.page.stockBalances.title=Stock balances
help.page.stockBalances.body=Current quantity and value of goods per warehouse. Quantity is always in the item base unit. Balance cannot go negative - an issue larger than the balance is rejected.
help.page.stockMovements.title=Stock movements
help.page.stockMovements.body=Immutable journal of all receipts, issues, adjustments and transfers. Each record links to its source document. Value is at the cost effective at movement time, in the home currency.
help.page.invValuation.title=Inventory valuation
help.page.invValuation.body=Quantity and value of stock per item and warehouse using the selected valuation method. The total matches the inventory account on the balance sheet. All amounts are in the home currency.
help.page.stockAdjustment.title=Inventory adjustment
help.page.stockAdjustment.body=Records the difference between actual and system stock: a decrease goes to expense, an increase adds to inventory value. Unit cost is optional for an increase - if blank, the current cost is used; if the balance is zero, a cost is required.
help.page.stockTransfer.title=Warehouse transfer
help.page.stockTransfer.body=Moving goods from one warehouse to another. No ledger entry is written - value moves at the source warehouse cost. Both warehouses keep their own movement record.
help.page.accounts.title=Chart of accounts
help.page.accounts.body=Tree of all accounts: assets, liabilities, equity, income, expenses. The account type and detail type drive posting rules. System accounts are used by automatic postings - they cannot be deleted, and rename them with care.
help.page.accountTransactions.title=Account activity
help.page.accountTransactions.body=All ledger lines for the selected account in chronological order, with their source documents. Used to inspect an account and trace where its balance comes from.
help.page.journalEntries.title=Journal entries
help.page.journalEntries.body=All accounting entries: written automatically from documents or entered manually. In every entry, debits equal credits in the home currency. A posted entry cannot be changed - only reversed.
help.page.trialBalance.title=Trial balance
help.page.trialBalance.body=Opening balance, turnover and closing balance for every account. Debit and credit totals are always equal - the core accounting check. All amounts are in the home currency.
help.page.balanceSheet.title=Balance sheet
help.page.balanceSheet.body=Financial position on the selected date: assets, liabilities and equity. Total assets always equal liabilities plus equity. All amounts are in the home currency.
help.page.profitLoss.title=Profit and loss
help.page.profitLoss.body=Income, expenses and net profit for the selected period. The fiscal year start comes from the month set in company settings. All amounts are in the home currency.
help.page.statement.title=Customer statement
help.page.statement.body=Period activity for the selected customer: opening balance, invoices, payments, applied credits and the closing balance. A print view is available for sending to the customer. All amounts are in the home currency.
help.page.payrollRuns.title=Payroll runs
help.page.payrollRuns.body=Monthly payroll calculation documents: gross pay, deductions and net pay per employee. Posting writes the expense and liability entries. Only one posted run is allowed per month.
help.page.payrollPayments.title=Payroll payments
help.page.payrollPayments.body=Documents for paying advances and salaries. A payment is not linked to a run: an advance creates a temporary per-employee debit, and the month-end run settles it. Payments are in the home currency only.
help.page.payrollRegister.title=Payroll register
help.page.payrollRegister.body=Per-employee summary for the selected month: opening balance, accrued, deductions, paid and closing balance. The balance is what the company owes the employee. All amounts are in the home currency.
help.page.items.title=Products and services
help.page.items.body=Catalog of items you sell and buy. Inventory items are tracked in the warehouse; service items go straight to income and expense. Each item stores default unit, price and tax values.
help.page.categories.title=Item categories
help.page.categories.body=A tree for grouping items - for filtering lists and keeping order. Categories do not affect accounting.
help.page.units.title=Units of measure
help.page.units.body=Catalog of quantity units: piece, kg, box and others. If a unit belongs to a group, conversion works within the group - enter documents in one unit and the warehouse is updated in the base unit.
help.page.unitGroups.title=Unit groups
help.page.unitGroups.body=A set of units convertible into each other, such as piece and box. Each group has one base unit; the others link to it by a factor. Stock balances and prices are always kept in the base unit.
help.page.priceLists.title=Price lists
help.page.priceLists.body=Separate sales prices for customer segments. Customers are assigned to a list - invoice lines pick the price from it automatically. Tiered prices by quantity are also supported.
help.page.contacts.title=Contacts
help.page.contacts.body=Catalog of customers, suppliers and employees. Balances and document history are tracked per contact. A contact cannot be deleted - only deactivated.
help.page.contactCard.title=Contact page
help.page.contactCard.body=Contact overview: current balance, open documents, recent activity and a period statement. Editing the contact opens in a separate form.
help.page.plByClass.title=Profit and loss by class
help.page.plByClass.body=Income and expenses split by business classes. Lines without a class fall into a separate column; column totals exactly match the plain profit and loss report. All amounts are in the home currency.
help.page.search.title=Global search
help.page.search.body=Search the whole system from one field: document numbers, contacts, items, accounts, screen and report names. Clicking a result opens the related page.
help.page.auditLog.title=Audit log
help.page.auditLog.body=Immutable log of who did what and when: document actions, sign-in attempts, user management. Records cannot be deleted or edited.
help.page.users.title=Users
help.page.users.body=System users and their roles: ADMIN manages everything, ACCOUNTANT works with documents, VIEWER can only view. A user cannot be deleted - only deactivated, keeping the audit trail.
help.page.settings.title=Company settings
help.page.settings.body=Core settings: name, home currency, timezone, inventory valuation method, fiscal year, closing date and payroll rates. Some choices (home currency, valuation method) lock after first use - pick them carefully at the start.
help.page.telegram.title=Telegram bot
help.page.telegram.body=Your company's own Telegram bot: created in @BotFather, its token pasted here. The token is verified (getMe) and stored encrypted - only a mask is shown on screen, and it is never logged or audited. Once the bot is connected, users can link their Telegram account from their profile. Deleting the token disconnects the bot but keeps linked users.
help.page.plugins.title=Plugins
help.page.plugins.body=Registry of optional features: when a plugin is enabled its menu and settings appear, when disabled they are hidden. Disabling does NOT delete plugin data - everything is restored on re-enable. Every toggle is written to the audit log.
help.page.profile.title=Profile
help.page.profile.body=Your profile: email, gender, date of birth, phone and profile photo (avatar). These details are optional - your login username and password stay unchanged. You can also change your password on this page. Every role manages its own profile.
help.page.company.title=Company information
help.page.company.body=Full company requisites: legal name, address, tax ID, bank, director and logo. These are used in documents and print headers. The main display name is on the Settings page.
help.page.taxRates.title=VAT rates
help.page.taxRates.body=Tax rate catalog. A rate is selected on each document line and its value is stored with the line - changing the catalog later does not change historical documents. A rate cannot be deleted - only deactivated.
help.page.paymentMethods.title=Payment methods
help.page.paymentMethods.body=Payment method catalog: cash, bank transfer and others. Selected on documents as a label - it does not affect accounting. A method cannot be deleted - only deactivated.
help.page.classes.title=Classes
help.page.classes.body=Tags for tracking income and expenses by business lines (department, branch, activity). They do not affect amounts - they only segment profit and loss analysis. No deletion - deactivate instead.
help.page.import.title=Import from Excel
help.page.import.body=Load a new company's data from one Excel file: contacts and items. Download the template, fill it in and upload it back. Names already in the database are skipped; a duplicate name inside the file is an error.
help.page.factoryReset.title=Factory reset
help.page.factoryReset.body=Deletes all entered data and returns the system to a freshly installed state. Used to clear demo and trial data. The action cannot be undone - confirmation takes two steps.
help.page.closingDate.title=Closing date
help.page.closingDate.body=Closing the period locks the accounting period up to the set date: no new entries can be posted on or before that date, so prior-period reports stay unchanged. To fix a document in a closed period, the reversal is dated in an open period. Leave it empty for no lock. Equivalent to "Close the books" in QuickBooks Online.
help.field.closingDate.title=Closing date
help.field.closingDate.body=No new entry can be posted on or before this date - past period reports stay unchanged. To correct a document in a closed period, the reversal is dated in the open period: closed period balances stay intact and the correction shows on its own date. Leave blank for no lock. The date can be moved or removed.
help.field.companyLogo.title=Document logo
help.field.companyLogo.body=Appears in document and report print headers (e.g. invoices). Not the topbar brand - that is separate ("Brand logo").
help.field.brandLogo.title=Brand logo
help.field.brandLogo.body=Shown in the system topbar instead of "AVERPO" (white-label). Unlike the document logo, this is screen-only and never appears in documents.
help.field.homeCurrency.title=Home currency
help.field.homeCurrency.body=The main accounting currency: every entry balances in it and reports are shown in it. It locks after the first posted entry and cannot be changed afterwards. Foreign currency documents are converted into it using the exchange rate.
help.field.valuationMethod.title=Inventory valuation method
help.field.valuationMethod.body=Defines how the cost of issued goods is calculated: AVCO - average cost, FIFO - first received batch is issued first. Costing is tracked per item and warehouse. The method locks after the first stock movement - history cannot be recalculated.
help.field.payrollRates.title=Payroll rates
help.field.payrollRates.body=Three independent percentages: income tax and pension are withheld from the employee's pay, social tax is on the employer. Calculated amounts are stored in the document - changing a rate later does not change old runs. Pension is a separate deduction, not part of income tax - adjust the rates if you need the official interpretation.
help.field.fiscalYearStart.title=Fiscal year start
help.field.fiscalYearStart.body=The split between Retained earnings and Net income on the balance sheet is computed from this month. It can be changed at any time - it only affects report presentation, not stored data.
help.field.timezone.title=Timezone
help.field.timezone.body=All times are stored in UTC and shown on screen in this timezone. Changing it does not affect stored data - only the display changes.
help.field.classTracking.title=Class tracking mode
help.field.classTracking.body=Defines how a class is selected on documents: off, per line, or one for the whole document. Switching the mode does not change existing documents. Classes do not affect amounts - they only segment analysis.
help.field.exchangeRate.title=Exchange rate
help.field.exchangeRate.body=The rate for the document date is filled in automatically and can be edited. The rate is stored with the document - later catalog updates do not change it. Any difference with the payment-date rate is posted as a separate exchange difference entry.
help.field.vatMode.title=Amounts inclusive or exclusive of VAT
help.field.vatMode.body=Defines how line prices are entered: in exclusive mode tax is added on top of the price, in inclusive mode it is extracted from the price. Either way the document total is gross. The rate is chosen per line.
help.field.depositAccount.title=Deposit account
help.field.depositAccount.body=The account that receives the payment: bank, cash or Undeposited funds. The undeposited account holds receipts not yet taken to the bank - later they are grouped into a bank deposit. Foreign currency payments are received through it.
help.field.unitFactor.title=Unit factor
help.field.unitFactor.body=How many base units one of this unit equals, for example 1 box = 12 pieces. Document lines keep the entered unit while the warehouse is updated in the base unit. The factor is stored with the line - changing it later does not change historical documents.
help.field.payrollPeriod.title=Payroll month and posting date
help.field.payrollPeriod.body=The period says which month is being calculated; the run date says when it hits the ledger. The date must be inside that same month - it cannot fall into the previous or next month. Only one posted run is allowed per month.
help.field.reconBalance.title=Statement balance
help.field.reconBalance.body=The closing balance from the bank statement - the goal of reconciliation is to match this number exactly. The opening balance comes automatically from the previous completed reconciliation; the first one is entered manually. The period completes only when the difference with ticked lines reaches zero.
help.field.openingBalance.title=Opening balance
help.field.openingBalance.body=The account's existing balance when moving to the system: the offsetting side goes automatically to the Opening balance equity account. Entered once per account; if wrong, reverse and re-enter. Customer and supplier balances do not go here - enter them as open invoices and bills.
help.field.lcAllocation.title=Landed cost allocation
help.field.lcAllocation.body=The entered amount is split across selected receipts in proportion to their value. For each receipt, the part still in stock adds to inventory value and the sold part goes to cost of goods sold. The amount comes from costs collected on the clearing account - watching its balance is manual.
help.field.creditApply.title=Applying a credit
help.field.creditApply.body=Applying a credit to an open document reduces its balance - no money moves and no entry is written (only a foreign currency difference may post). Application is manual only - you decide which document gets how much. An applied credit cannot be reversed - unapply it first.
help.field.estimateExpiry.title=Estimate expiration
help.field.estimateExpiry.body=Shows until when the quoted price stands for the customer. The document does not close automatically after the date - it is informational only. The field is optional.
help.field.paymentTerm.title=Payment term
help.field.paymentTerm.body=The payment period attached to the contact, in days. The document due date is computed from it automatically and can be changed on the document. Overdue balances fall into the overdue buckets of aging reports.
help.field.agingBuckets.title=Aging buckets
help.field.agingBuckets.body=Open balances are grouped by days past the due date: Current - not yet due, then 1-30, 31-60, 61-90 and 90+ days overdue. The further right the column, the older the debt.
help.field.runningBalance.title=Running balance column
help.field.runningBalance.body=The accumulated balance after each activity: invoices add to the opening balance, payments and credits subtract from it. The last row equals the closing balance.
help.field.allAmountsHome.title=All amounts in home currency
help.field.allAmountsHome.body=The report reads from the general ledger, which always balances in the home currency - so every figure is in it. Foreign currency documents entered the ledger converted at their own rates.
