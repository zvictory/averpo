<!-- Penguin UI: Modal (modern/semantic вариант).
     Манба: penguinui.com/components/modal. Каноник ўрам: fixed inset-0
     backdrop (bg-black/20 + backdrop-blur) + x-trap.inert.noscroll +
     Esc.window + click.self ёпади; панел bg-surface (dark жуфти),
     border-outline, rounded-radius, x-transition scale. -->
<div x-cloak x-show="modalIsOpen" x-transition.opacity.duration.200ms
     x-trap.inert.noscroll="modalIsOpen"
     x-on:keydown.esc.window="modalIsOpen = false"
     x-on:click.self="modalIsOpen = false"
     class="fixed inset-0 z-30 flex items-end justify-center bg-black/20 p-4 pb-8 backdrop-blur-md sm:items-center lg:p-8"
     role="dialog" aria-modal="true" aria-labelledby="defaultModalTitle">
    <div x-show="modalIsOpen"
         x-transition:enter="transition ease-out duration-200 delay-100 motion-reduce:transition-opacity"
         x-transition:enter-start="opacity-0 scale-50" x-transition:enter-end="opacity-100 scale-100"
         class="flex max-w-lg flex-col gap-4 overflow-hidden rounded-radius border border-outline bg-surface text-on-surface dark:border-outline-dark dark:bg-surface-dark-alt dark:text-on-surface-dark">
        <div class="flex items-center justify-between border-b border-outline bg-surface-alt/60 p-4 dark:border-outline-dark dark:bg-surface-dark/20">
            <h3 id="defaultModalTitle" class="font-semibold tracking-wide text-on-surface-strong dark:text-on-surface-dark-strong">Title</h3>
            <button x-on:click="modalIsOpen = false" aria-label="close modal">✕</button>
        </div>
        <div class="px-4 pb-4">Body</div>
    </div>
</div>

<!-- Averpo мослашуви (Arbitr-117в, қидирув command-palette):
     - жойлашув марказ эмас, ТЕПАРОҚ (items-start + pt-[12vh]) - Penguin
       сайти қидируви услуби;
     - backdrop ДЕЯРЛИ ШАФФОФ: bg-black/10, blur ЙЎҚ (фойдаланувчи
       талаби - орқадаги экран танилиб туриши шарт; каноник bg-black/20
       + backdrop-blur-md ишлатилмайди);
     - панел ичи: text-input (лупа + kbd ёрлиқлар) + HTMX натижа зонаси;
       ↑/↓/Enter навигация combobox услубида;
     - панелда dark: жуфтлари ЙЎҚ - палитра КОНТЕНТ зонаси устида ва
       унинг режимига эргашади: контент ҳали эски (оч) услубда, натижа
       класслари (.search-hit оиласи) ҳам оч - жуфтлар контент
       свипларида (120+) .search-* оиласи билан бирга келади. -->
