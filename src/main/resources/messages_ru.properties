# ARBITR-079: тексты контекстной справки (?) (help-system.md)
help.button=Справка
help.page.dashboard.title=Главная страница
help.page.dashboard.body=Общая картина финансов компании: прибыль и убыток, денежный поток, остатки банков, открытые инвойсы и закупки, стоимость запасов. Каждая карточка ведёт к своему отчёту или списку. Цифры считаются вживую из главной книги.
help.page.invoices.title=Счета на продажу
help.page.invoices.body=Документы продажи в кредит. При проведении инвойса записывается доход и долг клиента (AR), товарные строки списываются со склада. Оплата принимается отдельным документом «Поступление» и распределяется по открытым инвойсам.
help.page.salesReceipts.title=Чеки продажи
help.page.salesReceipts.body=Продажа и оплата в одном документе: деньги сразу попадают в банк или кассу, долг клиента не ведётся. Для продажи в кредит используется инвойс. Проведённый чек не меняется - исправление через сторно.
help.page.creditMemos.title=Кредит-ноты
help.page.creditMemos.body=Документ возврата товара или отмены продажи: доход уменьшается, товар возвращается на склад. Полученный кредит закрывается применением к открытым инвойсам клиента или остаётся как аванс.
help.page.refundReceipts.title=Чеки возврата денег
help.page.refundReceipts.body=Немедленный возврат денег клиенту: расход из банка или кассы, доход уменьшается, товар возвращается на склад. Отличие от кредит-ноты - долг клиента не затрагивается, деньги возвращаются сразу.
help.page.estimates.title=Предложения
help.page.estimates.body=Ценовое предложение клиенту (смета). Не влияет на учёт и склад - только документооборот. При согласии клиента в один шаг превращается в инвойс.
help.page.invoicePayments.title=Поступления
help.page.invoicePayments.body=Документы получения денег от клиентов. Оплата распределяется по открытым инвойсам; излишек остаётся авансом. В валюте разница курсов документа и оплаты записывается автоматически как курсовая разница.
help.page.arAging.title=Анализ дебиторки
help.page.arAging.body=Открытые долги клиентов по срокам: текущие и просроченные группы. Срок считается от даты оплаты инвойса. Все суммы в базовой (home) валюте.
help.page.bills.title=Счета на закупку
help.page.bills.body=Документы закупки в кредит. При проведении записывается расход или приход на склад и долг поставщику (AP). Оплата выполняется отдельным документом «Платёж».
help.page.payments.title=Платежи поставщикам
help.page.payments.body=Документы оплаты поставщикам. Платёж распределяется по открытым счетам; излишек остаётся авансом. В валюте курсовая разница записывается автоматически.
help.page.purchaseOrders.title=Заказы на закупку
help.page.purchaseOrders.body=Заказ поставщику (PO). Не влияет на учёт и склад - при получении товара превращается в счёт (Bill). Конвертированный заказ закрывается и повторно не используется.
help.page.vendorCredits.title=Кредит-ноты поставщика
help.page.vendorCredits.body=Документ возврата товара поставщику или уменьшения закупки: долг поставщику уменьшается, товар списывается со склада. Кредит закрывается применением к открытым счетам.
help.page.landedCosts.title=Распределения landed cost
help.page.landedCosts.body=Распределение дополнительных затрат (доставка, таможня) в себестоимость оприходованного товара. Сумма делится по выбранным приходам пропорционально их стоимости: складская часть увеличивает стоимость запаса, проданная уходит в себестоимость (COGS).
help.page.apAging.title=Анализ кредиторки
help.page.apAging.body=Открытые долги поставщикам по срокам: текущие и просроченные группы. Срок считается от даты оплаты счёта. Все суммы в базовой (home) валюте.
help.page.expenses.title=Расходы
help.page.expenses.body=Прямые траты из банка или кассы: документ проводится при создании, в каждой строке выбирается счёт расхода. Долг поставщику не ведётся - для закупки в кредит используется Bill.
help.page.bankTransactions.title=Банковские операции
help.page.bankTransactions.body=Движения банка и кассы: приход, расход и перевод в одном списке. Документ проводится при создании, исправление через сторно. Приход может быть многострочным - в каждой строке свой счёт-источник.
help.page.transfers.title=Переводы
help.page.transfers.body=Перемещение денег между двумя счетами: из банка в кассу, со счёта на счёт. При разных валютах вводятся суммы обеих сторон - разница уходит на счёт курсовой разницы. Документ проводится сразу, исправление через сторно.
help.page.reconciliations.title=Сверка банка
help.page.reconciliations.body=Сверка банковской выписки с записями системы. Вводится период и конечный остаток выписки, строки главной книги отмечаются по одной; период закрывается при нулевой разнице. Закрытая сверка не меняется.
help.page.warehouses.title=Склады
help.page.warehouses.body=Каталог складов: каждый приход и расход записывается на конкретный склад, остатки и себестоимость ведутся по складам. Склад не удаляется - только деактивируется, история сохраняется.
help.page.stockBalances.title=Складские остатки
help.page.stockBalances.body=Текущий остаток и стоимость товаров по складам. Количество всегда в базовой единице товара. Остаток не может уйти в минус - расход больше остатка отклоняется.
help.page.stockMovements.title=Складские движения
help.page.stockMovements.body=Неизменяемый журнал всех приходов, расходов, инвентаризаций и перемещений. Каждая запись ссылается на документ-источник. Стоимость - по себестоимости на момент движения, в базовой валюте.
help.page.invValuation.title=Оценка запасов
help.page.invValuation.body=Количество и стоимость запасов по товарам и складам выбранным методом оценки. Итог совпадает со счётом запасов в балансе. Все суммы в базовой (home) валюте.
help.page.stockAdjustment.title=Инвентаризационная корректировка
help.page.stockAdjustment.body=Запись разницы между фактическим и учётным остатком: уменьшение уходит в расход, увеличение добавляется к стоимости запаса. Цена при увеличении необязательна - пустая берётся по текущей себестоимости; при нулевом остатке цена обязательна.
help.page.stockTransfer.title=Перемещение между складами
help.page.stockTransfer.body=Перемещение товара с одного склада на другой. Проводка не пишется - стоимость переходит по себестоимости склада-источника. На обоих складах остаётся своя запись движения.
help.page.accounts.title=План счетов
help.page.accounts.body=Дерево всех счетов: активы, обязательства, капитал, доходы, расходы. Тип счёта и детальный тип определяют правила проводок. Системные счета используются автоматическими проводками - их нельзя удалить, переименовывайте осторожно.
help.page.accountTransactions.title=Операции по счёту
help.page.accountTransactions.body=Все строки проводок выбранного счёта в хронологическом порядке с документом-источником. Используется для проверки счёта и поиска источника остатка.
help.page.journalEntries.title=Журнальные проводки
help.page.journalEntries.body=Все бухгалтерские проводки: записанные автоматически из документов и введённые вручную. В каждой проводке дебет и кредит равны в базовой валюте. Проведённая проводка не меняется - только сторно.
help.page.trialBalance.title=Оборотно-сальдовая ведомость
help.page.trialBalance.body=По каждому счёту: остаток на начало, обороты и остаток на конец. Итоги дебета и кредита всегда равны - базовая проверка учёта. Все суммы в базовой (home) валюте.
help.page.balanceSheet.title=Баланс
help.page.balanceSheet.body=Финансовое положение на выбранную дату: активы, обязательства и капитал. Итог активов всегда равен сумме обязательств и капитала. Все суммы в базовой (home) валюте.
help.page.profitLoss.title=Прибыль и убыток
help.page.profitLoss.body=Доходы, расходы и чистая прибыль за выбранный период. Начало финансового года берётся из месяца в настройках. Все суммы в базовой (home) валюте.
help.page.statement.title=Выписка по клиенту
help.page.statement.body=Движения за период по выбранному клиенту: долг на начало, инвойсы, оплаты, применённые кредиты и остаток на конец. Есть печатный вид для отправки клиенту. Все суммы в базовой (home) валюте.
help.page.payrollRuns.title=Начисления зарплаты
help.page.payrollRuns.body=Документы месячного начисления зарплаты: по каждому сотруднику оклад, удержания и сумма к выплате. При проведении пишутся проводки расходов и обязательств. На один месяц допускается только одно проведённое начисление.
help.page.payrollPayments.title=Выплаты зарплаты
help.page.payrollPayments.body=Документы выплаты авансов и зарплаты. Выплата не привязана к начислению: аванс создаёт временный долг по сотруднику, начисление конца месяца его закрывает. Выплаты только в базовой валюте.
help.page.payrollRegister.title=Зарплатная ведомость
help.page.payrollRegister.body=Сводка по сотрудникам за выбранный месяц: остаток на начало, начислено, удержания, выплачено и остаток на конец. Остаток - долг компании перед сотрудником. Все суммы в базовой (home) валюте.
help.page.items.title=Товары и услуги
help.page.items.body=Каталог продаваемых и закупаемых позиций. Товар ведётся в складском учёте, услуга идёт только в доход и расход. У каждой позиции хранятся значения по умолчанию: единица, цена и налог.
help.page.categories.title=Категории товаров
help.page.categories.body=Дерево группировки товаров - для фильтрации списков и порядка. На учёт категории не влияют.
help.page.units.title=Единицы измерения
help.page.units.body=Каталог единиц количества: штука, кг, коробка и другие. Если единица входит в группу, внутри группы работает конверсия - в документ вводится одна единица, на склад списывается базовая.
help.page.unitGroups.title=Группы единиц
help.page.unitGroups.body=Набор взаимно конвертируемых единиц, например штука и коробка. В группе одна базовая единица, остальные связаны с ней коэффициентом. Складские остатки и цены всегда ведутся в базовой единице.
help.page.priceLists.title=Прайс-листы
help.page.priceLists.body=Отдельные цены продажи для категорий клиентов. К списку привязываются клиенты - в строке инвойса цена подставляется автоматически. Возможны ступенчатые цены по количеству.
help.page.contacts.title=Контакты
help.page.contacts.body=Каталог клиентов, поставщиков и сотрудников. По каждому контакту ведётся долг и история документов. Контакт не удаляется - только деактивируется.
help.page.contactCard.title=Страница контакта
help.page.contactCard.body=Обзор контакта: текущий долг, открытые документы, последние движения и выписка за период. Редактирование данных открывается в отдельной форме.
help.page.plByClass.title=Прибыль и убыток по классам
help.page.plByClass.body=Доходы и расходы в разрезе направлений бизнеса. Строки без класса попадают в отдельную колонку; сумма колонок точно равна обычному отчёту о прибыли. Все суммы в базовой (home) валюте.
help.page.search.title=Глобальный поиск
help.page.search.body=Поиск по всей системе из одного поля: номера документов, контакты, товары, счета, названия экранов и отчётов. Клик по результату открывает нужную страницу.
help.page.auditLog.title=Журнал аудита
help.page.auditLog.body=Неизменяемый журнал того, кто, когда и что сделал: действия с документами, попытки входа, управление пользователями. Записи не удаляются и не редактируются.
help.page.users.title=Пользователи
help.page.users.body=Пользователи системы и их роли: ADMIN управляет всем, ACCOUNTANT работает с документами, VIEWER только просматривает. Пользователь не удаляется - только деактивируется, след аудита сохраняется.
help.page.settings.title=Настройки компании
help.page.settings.body=Основные настройки: название, базовая валюта, часовой пояс, метод оценки запасов, финансовый год, дата закрытия и ставки зарплаты. Некоторые решения (базовая валюта, метод оценки) блокируются после первого использования - выбирайте их сразу правильно.
help.page.telegram.title=Telegram-бот
help.page.telegram.body=Собственный Telegram-бот компании: создаётся в @BotFather, его токен вводится здесь. Токен проверяется (getMe) и хранится зашифрованным - на экране видна только маска, в журнал и аудит он не пишется. После подключения бота пользователи могут привязать свой аккаунт Telegram в профиле. Удаление токена отключает бота, но привязанные пользователи сохраняются.
help.page.plugins.title=Плагины
help.page.plugins.body=Реестр необязательных функций: при включении плагина появляются его меню и настройки, при выключении они скрываются. Выключение НЕ удаляет данные плагина - при повторном включении всё восстанавливается. Каждое переключение записывается в журнал аудита.
help.page.profile.title=Профиль
help.page.profile.body=Ваш профиль: email, пол, дата рождения, телефон и фото профиля (аватар). Эти данные необязательны - логин и пароль не меняются. Здесь же можно сменить пароль. Каждая роль управляет своим профилем.
help.page.company.title=Данные компании
help.page.company.body=Полные реквизиты компании: юридическое название, адрес, ИНН, банк, руководитель и логотип. Используются в документах и заголовках печати. Основное отображаемое название - на странице настроек.
help.page.taxRates.title=Ставки НДС
help.page.taxRates.body=Каталог налоговых ставок. Ставка выбирается в строке документа, и её значение сохраняется в строке - последующее изменение каталога не меняет исторические документы. Ставка не удаляется - только деактивируется.
help.page.paymentMethods.title=Способы оплаты
help.page.paymentMethods.body=Каталог способов оплаты: наличные, банковский перевод и другие. Выбирается в документах как метка - на учёт не влияет. Способ не удаляется - только деактивируется.
help.page.classes.title=Классы
help.page.classes.body=Метки для учёта доходов и расходов по направлениям бизнеса (отдел, филиал, вид деятельности). На суммы не влияют - только сегментируют анализ прибыли. Удаления нет - деактивация.
help.page.import.title=Импорт из Excel
help.page.import.body=Загрузка данных новой компании из одного файла Excel: контакты и товары. Скачайте шаблон, заполните и загрузите обратно. Имена, уже существующие в базе, пропускаются; повтор имени внутри файла - ошибка.
help.page.factoryReset.title=Возврат к заводскому состоянию
help.page.factoryReset.body=Удаляет все введённые данные и возвращает систему в состояние новой установки. Используется для очистки демо и тестовых данных. Действие необратимо - подтверждение в два шага.
help.page.closingDate.title=Дата закрытия периода
help.page.closingDate.body=Закрытие периода - блокировка учётного периода до указанной даты: на дату закрытия и более ранние даты новые проводки вводить нельзя, отчёты прошлых периодов остаются неизменными. Чтобы исправить документ закрытого периода, сторно записывается датой открытого периода. Пустое значение - блокировки нет. Аналог «Закрытие книг» (Close the books) в QuickBooks Online.
help.field.closingDate.title=Дата закрытия периода
help.field.closingDate.body=На эту дату и раньше новые проводки не вводятся - отчёты прошлых периодов остаются неизменными. Если нужно исправить документ закрытого периода, сторно датируется открытым периодом: остатки закрытого периода не меняются, исправление отражается своей датой. Пустое поле - блокировки нет. Дату можно сдвинуть или убрать.
help.field.companyLogo.title=Логотип документов
help.field.companyLogo.body=Появляется в заголовках печати документов и отчётов (например, счета). Это не бренд в топбаре - он отдельный («Логотип бренда»).
help.field.brandLogo.title=Логотип бренда
help.field.brandLogo.body=Показывается в топбаре системы вместо «AVERPO» (white-label). В отличие от логотипа документов, только на экране, в документы не попадает.
help.field.homeCurrency.title=Базовая (home) валюта
help.field.homeCurrency.body=Основная валюта учёта: все проводки балансируются в ней, отчёты выводятся в ней. После первой проведённой проводки блокируется и больше не меняется. Валютные документы конвертируются в неё по курсу.
help.field.valuationMethod.title=Метод оценки запасов
help.field.valuationMethod.body=Определяет, как считается себестоимость списания: AVCO - средняя стоимость, FIFO - первой уходит первая поступившая партия. Учёт ведётся по товару и складу. После первого складского движения метод блокируется - историю пересчитать нельзя.
help.field.payrollRates.title=Ставки зарплаты
help.field.payrollRates.body=Три независимых процента: подоходный налог и пенсионный взнос удерживаются из оклада сотрудника, социальный налог ложится на работодателя. Рассчитанные суммы сохраняются в документе - изменение ставки не меняет старые начисления. Пенсионный взнос не входит в подоходный налог, это отдельное удержание - при официальной трактовке настройте ставки соответственно.
help.field.fiscalYearStart.title=Начало финансового года
help.field.fiscalYearStart.body=Разделение нераспределённой прибыли и чистой прибыли в балансе считается от этого месяца. Можно менять в любой момент - влияет только на вид отчёта, сохранённые данные не трогает.
help.field.timezone.title=Часовой пояс
help.field.timezone.body=Все времена хранятся в базе в UTC, на экране показываются в этом поясе. Смена пояса не влияет на сохранённые данные - меняется только отображение.
help.field.classTracking.title=Режим учёта классов
help.field.classTracking.body=Определяет, как класс выбирается в документах: выключено, в каждой строке или один на весь документ. Смена режима не меняет старые документы. Классы не влияют на суммы - только сегментируют анализ.
help.field.exchangeRate.title=Курс валюты
help.field.exchangeRate.body=Курс на дату документа подставляется автоматически, его можно править вручную. Курс сохраняется в документе - последующее обновление каталога его не меняет. Разница с курсом на дату оплаты записывается отдельной проводкой курсовой разницы.
help.field.vatMode.title=Суммы с НДС или без
help.field.vatMode.body=Определяет, как вводятся цены строк: в режиме «без НДС» налог добавляется сверху, в режиме «с НДС» выделяется из цены. В обоих случаях итог документа считается с налогом. Ставка выбирается в каждой строке.
help.field.depositAccount.title=Счёт зачисления
help.field.depositAccount.body=Счёт, куда попадает оплата: банк, касса или транзит поступлений. Транзитный счёт - для выручки, ещё не сданной в банк; позже она объединяется банковским приходом. Валютные оплаты принимаются через транзит.
help.field.unitFactor.title=Коэффициент единицы
help.field.unitFactor.body=Сколько базовых единиц содержит одна эта единица, например 1 коробка = 12 штук. В строке документа количество хранится во введённой единице, на склад списывается базовая. Коэффициент сохраняется в строке - его изменение не меняет исторические документы.
help.field.payrollPeriod.title=Месяц начисления и дата проводки
help.field.payrollPeriod.body=Период задаёт, за какой месяц начисление; дата проводки - когда оно попадает в главную книгу. Дата обязана быть внутри того же месяца - ни в предыдущий, ни в следующий. На месяц допускается одно проведённое начисление.
help.field.reconBalance.title=Остаток выписки
help.field.reconBalance.body=Конечный остаток периода из банковской выписки - цель сверки в точном совпадении с этим числом. Начальный остаток берётся автоматически из предыдущей завершённой сверки, в первой вводится вручную. Период закрывается только при нулевой разнице с отмеченными строками.
help.field.openingBalance.title=Начальный остаток
help.field.openingBalance.body=Существующий остаток счёта при переходе в систему: встречная сторона автоматически пишется на счёт начальных остатков. Вводится один раз на счёт; при ошибке - сторно и повторный ввод. Долги клиентов и поставщиков сюда не входят - они вводятся открытыми инвойсами и счетами.
help.field.lcAllocation.title=Распределение landed cost
help.field.lcAllocation.body=Введённая сумма делится по выбранным приходам пропорционально их стоимости. По каждому приходу складская часть добавляется к стоимости запаса, проданная уходит в себестоимость. Сумма берётся из затрат, накопленных на клиринговом счёте - контроль остатка ручной.
help.field.creditApply.title=Применение кредита
help.field.creditApply.body=Применение кредита к открытому документу уменьшает его остаток - деньги не движутся, проводка не пишется (возможна лишь курсовая разница в валюте). Применение только ручное - вы сами решаете, какому документу сколько. Применённый кредит не сторнируется - сначала отмените применение.
help.field.estimateExpiry.title=Срок действия предложения
help.field.estimateExpiry.body=Показывает, до какой даты цена действительна для клиента. По истечении срока документ автоматически не закрывается - это информационная метка. Поле необязательное.
help.field.paymentTerm.title=Условие оплаты
help.field.paymentTerm.body=Срок оплаты, закреплённый за контактом, в днях. Дата оплаты документа считается из него автоматически, при необходимости меняется в документе. Просроченные долги попадают в просроченные группы отчётов старения.
help.field.agingBuckets.title=Группы сроков
help.field.agingBuckets.body=Открытые долги группируются по дням после даты оплаты: «Текущие» - срок ещё не наступил, далее 1-30, 31-60, 61-90 и 90+ дней просрочки. Чем правее колонка, тем старше долг.
help.field.runningBalance.title=Колонка текущего остатка
help.field.runningBalance.body=Накопленный остаток после каждого движения: к долгу на начало прибавляются инвойсы, вычитаются оплаты и кредиты. Значение последней строки равно остатку на конец периода.
help.field.allAmountsHome.title=Все суммы в базовой валюте
help.field.allAmountsHome.body=Отчёт читается из главной книги, а она всегда балансируется в базовой (home) валюте - поэтому все цифры в ней. Валютные документы попали в учёт уже конвертированными по своим курсам.
