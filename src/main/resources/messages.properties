# DEC-079: контекстли ёрдам (?) матнлари (help-system.md)
help.button=Ёрдам
help.page.dashboard.title=Бош саҳифа
help.page.dashboard.body=Компания молиясининг умумий кўриниши: фойда-зарар, пул оқими, банк қолдиқлари, очиқ инвойс ва харидлар, захира қиймати. Ҳар карта тегишли ҳисобот ёки рўйхатга олиб боради. Рақамлар бош дафтар (GL) маълумотидан жонли ҳисобланади.
help.page.invoices.title=Сотув ҳисобварақлари
help.page.invoices.body=Мижозга кредитга сотув ҳужжатлари. Invoice тасдиқланганда даромад ва мижоз қарзи (AR) ёзилади, товар сатрлари омбордан чиқади. Тўлов алоҳида Тушум ҳужжати билан қабул қилинади ва очиқ инвойсларга тақсимланади.
help.page.salesReceipts.title=Сотув чеклари
help.page.salesReceipts.body=Сотув ва тўлов битта ҳужжатда: пул дарҳол банк ёки кассага тушади, мижоз қарзи юритилмайди. Кредитга сотув учун Invoice ишлатилади. Тасдиқланган чек ўзгармайди - тузатиш сторно орқали.
help.page.creditMemos.title=Кредит-ноталар
help.page.creditMemos.body=Мижоз қайтарган товар ёки бекор қилинган сотув ҳужжати: даромад камаяди, товар омборга қайтади. Ҳосил бўлган кредит мижознинг очиқ инвойсларига Қўллаш орқали ёпилади ёки аванс сифатида туради.
help.page.refundReceipts.title=Пул қайтариш чеклари
help.page.refundReceipts.body=Мижозга пулни дарҳол қайтариш ҳужжати: банк ёки кассадан чиқим, даромад камаяди, товар омборга қайтади. Кредит-нотадан фарқи - мижоз қарзига тегилмайди, пул шу заҳоти қайтарилади.
help.page.estimates.title=Таклифлар
help.page.estimates.body=Мижозга юбориладиган нарх таклифи (смета). Бухгалтерия ва омборга таъсир қилмайди - фақат ҳужжат оқими. Мижоз қабул қилса бир қадамда Invoice ҳужжатига айлантирилади.
help.page.invoicePayments.title=Тушумлар
help.page.invoicePayments.body=Мижоздан пул қабул қилиш ҳужжатлари. Тўлов очиқ инвойсларга тақсимланади; ортиқчаси аванс бўлиб туради. Чет валютада ҳужжат ва тўлов курслари фарқи автоматик курс фарқи проводкаси билан ёзилади.
help.page.arAging.title=Дебиторлик таҳлили
help.page.arAging.body=Мижозларнинг очиқ қарзлари муддат кесимида: жорий ва кечиккан гуруҳлар. Муддат инвойснинг тўлов санасидан ҳисобланади. Барча суммалар home валютада.
help.page.bills.title=Харид ҳисобварақлари
help.page.bills.body=Таъминотчидан кредитга харид ҳужжатлари. Bill тасдиқланганда харажат ёки омбор кирими ва таъминотчи қарзи (AP) ёзилади. Тўлов алоҳида Тўлов ҳужжати билан амалга оширилади.
help.page.payments.title=Таъминотчи тўловлари
help.page.payments.body=Таъминотчига пул тўлаш ҳужжатлари. Тўлов очиқ харид ҳисобварақларига тақсимланади; ортиқчаси аванс бўлиб туради. Чет валютада курс фарқи автоматик ёзилади.
help.page.purchaseOrders.title=Харид буюртмалари
help.page.purchaseOrders.body=Таъминотчига юбориладиган буюртма (PO). Бухгалтерия ва омборга таъсир қилмайди - товар келгач Bill ҳужжатига айлантирилади. Айлантирилган буюртма ёпилади ва қайта ишлатилмайди.
help.page.vendorCredits.title=Таъминотчи кредит-ноталари
help.page.vendorCredits.body=Таъминотчига товар қайтариш ёки харидни камайтириш ҳужжати: таъминотчи қарзи камаяди, товар омбордан чиқади. Кредит очиқ харид ҳисобварақларига Қўллаш орқали ёпилади.
help.page.landedCosts.title=Landed cost тақсимотлари
help.page.landedCosts.body=Етказиб бериш, божхона каби қўшимча харажатларни кирим қилинган товар таннархига тақсимлаш. Сумма танланган киримларга қиймати бўйича пропорционал бўлинади: омбордаги қисм захира қийматини оширади, сотилган қисм таннархга (COGS) кетади.
help.page.apAging.title=Кредиторлик таҳлили
help.page.apAging.body=Таъминотчиларга очиқ қарзлар муддат кесимида: жорий ва кечиккан гуруҳлар. Муддат ҳужжатнинг тўлов санасидан ҳисобланади. Барча суммалар home валютада.
help.page.expenses.title=Чиқимлар
help.page.expenses.body=Банк ёки кассадан тўғридан-тўғри харажат: ҳужжат яратилиши билан тасдиқланади, ҳар сатрда харажат счёти танланади. Таъминотчи қарзи юритилмайди - кредитга харид учун Bill ишлатилади.
help.page.bankTransactions.title=Банк транзакциялари
help.page.bankTransactions.body=Банк ва касса ҳаракатлари: кирим, чиқим ва ўтказма битта рўйхатда. Ҳужжат яратилиши билан тасдиқланади, тузатиш сторно орқали. Кирим кўп сатрли бўлиши мумкин - ҳар сатрда манба счёти танланади.
help.page.transfers.title=Ўтказмалар
help.page.transfers.body=Икки счёт орасида пул кўчириш: банкдан кассага, счётдан счётга. Валюталар ҳар хил бўлса иккала томон суммаси киритилади - фарқ курс фарқи счётига ёзилади. Ҳужжат дарҳол тасдиқланади, тузатиш сторно орқали.
help.page.reconciliations.title=Банк солиштируви
help.page.reconciliations.body=Банк кўчирмаси билан тизимдаги ёзувларни солиштириш. Кўчирма даври ва якуний қолдиғи киритилади, бош дафтар сатрлари бир-бир белгиланади; фарқ нолга тушганда давр ёпилади. Ёпилган солиштирув ўзгармайди.
help.page.warehouses.title=Омборлар
help.page.warehouses.body=Омборлар каталоги: ҳар кирим ва чиқим аниқ омборга ёзилади, қолдиқ ва таннарх омбор кесимида юритилади. Омбор ўчирилмайди - фақат нофаол қилинади, тарихи сақланади.
help.page.stockBalances.title=Омбор қолдиқлари
help.page.stockBalances.body=Товарларнинг жорий қолдиғи ва қиймати омбор кесимида. Миқдор доим товарнинг асосий бирлигида. Қолдиқ манфий бўла олмайди - чиқим қолдиқдан ошса тизим рад этади.
help.page.stockMovements.title=Омбор ҳаракатлари
help.page.stockMovements.body=Барча кирим, чиқим, инвентаризация ва кўчиришларнинг ўзгармас журнали. Ҳар ёзув манба ҳужжатига ҳавола қилади. Қиймат ҳаракат пайтидаги таннархда, home валютада.
help.page.invValuation.title=Захира баҳоси
help.page.invValuation.body=Захираларнинг миқдори ва қиймати товар ва омбор кесимида, танланган баҳолаш усулида. Жами қиймат балансдаги захира счётига мос келади. Барча суммалар home валютада.
help.page.stockAdjustment.title=Инвентаризация тузатиши
help.page.stockAdjustment.body=Ҳақиқий қолдиқ билан тизимдаги қолдиқ фарқини ёзиш: камайиш харажатга, кўпайиш захира қийматига боради. Кўпайишда нарх ихтиёрий - бўш қолса жорий таннарх олинади; қолдиқ нол бўлса нарх шарт.
help.page.stockTransfer.title=Омборлараро кўчириш
help.page.stockTransfer.body=Товарни бир омбордан бошқасига кўчириш. Проводка ёзилмайди - қиймат манба омбор таннархида манзилга ўтади. Ҳар икки омборда алоҳида ҳаракат ёзуви қолади.
help.page.accounts.title=Счётлар режаси
help.page.accounts.body=Барча счётлар дарахти: актив, мажбурият, капитал, даромад, харажат. Счётнинг тури ва тафсилот тури проводка қоидаларини белгилайди. Тизим счётлари автоматик проводкаларда ишлатилади - уларни ўчириб бўлмайди, қайта номлашда эҳтиёт бўлинг.
help.page.accountTransactions.title=Счёт амаллари
help.page.accountTransactions.body=Танланган счёт бўйича барча проводка сатрлари хронологик тартибда, манба ҳужжати билан. Счётни текшириш ва қолдиқ қаердан келганини топишда ишлатилади.
help.page.journalEntries.title=Журнал проводкалари
help.page.journalEntries.body=Барча бухгалтерия проводкалари: ҳужжатлардан автоматик ёзилганлари ва қўлда киритилганлари. Ҳар проводкада дебет ва кредит home валютада тенг. Тасдиқланган проводка ўзгармайди - фақат сторно қилинади.
help.page.trialBalance.title=Айланма қолдиқ ведомости
help.page.trialBalance.body=Барча счётлар бўйича давр боши қолдиқ, айланмалар ва давр охири қолдиқ. Дебет ва кредит жамлари доим тенг - бухгалтериянинг асосий текшируви. Барча суммалар home валютада.
help.page.balanceSheet.title=Баланс
help.page.balanceSheet.body=Танланган санадаги молиявий ҳолат: активлар, мажбуриятлар ва капитал. Актив жами мажбурият ва капитал йиғиндисига доим тенг. Барча суммалар home валютада.
help.page.profitLoss.title=Фойда ва зарар
help.page.profitLoss.body=Танланган даврдаги даромадлар, харажатлар ва соф фойда. Молия йили бошланиши созламалардаги ойга қараб олинади. Барча суммалар home валютада.
help.page.statement.title=Мижоз кўчирмаси
help.page.statement.body=Танланган мижоз бўйича давр ҳаракатлари: давр боши қарз, инвойслар, тўловлар, қўлланган кредитлар ва давр охири қолдиқ. Мижозга юбориш учун чоп этиш кўриниши бор. Барча суммалар home валютада.
help.page.payrollRuns.title=Иш ҳақи ҳисоблашлари
help.page.payrollRuns.body=Ойлик иш ҳақи ҳисоблаш ҳужжатлари: ҳар ходим бўйича ойлик, ушланмалар ва қўлга тегадиган сумма. Тасдиқлашда харажат ва мажбурият проводкалари ёзилади. Бир ойга биттагина тасдиқланган ҳисоблаш бўлади.
help.page.payrollPayments.title=Иш ҳақи тўловлари
help.page.payrollPayments.body=Ходимларга аванс ва ойлик тўлаш ҳужжатлари. Тўлов ҳисоблашга боғланмайди: аванс ходим кесимида вақтинча қарз ҳосил қилади, ой охирги ҳисоблаш уни ёпади. Фақат home валютада тўланади.
help.page.payrollRegister.title=Иш ҳақи ведомости
help.page.payrollRegister.body=Танланган ой бўйича ходим кесимидаги жамлама: давр боши қолдиқ, ҳисобланган, ушланмалар, тўланган ва давр охири қолдиқ. Қолдиқ - компаниянинг ходимга қарзи. Барча суммалар home валютада.
help.page.items.title=Товар ва хизматлар
help.page.items.body=Сотиладиган ва харид қилинадиган позициялар каталоги. Товар тури омбор ҳисобида юритилади, хизмат тури фақат даромад ва харажатга боради. Ҳар позицияда бирлик, нарх ва солиқ бошланғич қийматлари сақланади.
help.page.categories.title=Товар категориялари
help.page.categories.body=Товарларни гуруҳлаш дарахти - рўйхатларда филтрлаш ва тартиб учун. Категория бухгалтерияга таъсир қилмайди.
help.page.units.title=Ўлчов бирликлари
help.page.units.body=Миқдор бирликлари каталоги: дона, кг, қути ва бошқалар. Бирлик гуруҳга киритилса, гуруҳ ичида конверсия ишлайди - ҳужжатга бир бирликда киритиб, омборга асосий бирликда туширилади.
help.page.unitGroups.title=Бирлик гуруҳлари
help.page.unitGroups.body=Бир-бирига айланадиган бирликлар тўплами, масалан дона ва қути. Гуруҳда битта асосий бирлик бўлади, қолганлари унга коэффициент орқали боғланади. Омбор қолдиғи ва нархлар доим асосий бирликда юритилади.
help.page.priceLists.title=Нарх рўйхатлари
help.page.priceLists.body=Мижоз тоифаларига алоҳида сотув нархлари. Рўйхатга мижозлар бириктирилади - инвойс сатрида нарх автоматик шу рўйхатдан олинади. Миқдорга қараб поғонали нарх ҳам белгилаш мумкин.
help.page.contacts.title=Контактлар
help.page.contacts.body=Мижозлар, таъминотчилар ва ходимлар каталоги. Ҳар контакт бўйича қарз ва ҳужжатлар тарихи юритилади. Контакт ўчирилмайди - фақат нофаол қилинади.
help.page.contactCard.title=Контакт саҳифаси
help.page.contactCard.body=Контактнинг умумий кўриниши: жорий қарз, очиқ ҳужжатлар, охирги ҳаракатлар ва давр кўчирмаси. Маълумотларни таҳрирлаш алоҳида формада очилади.
help.page.plByClass.title=Фойда ва зарар йўналишлар кесимида
help.page.plByClass.body=Даромад ва харажатлар бизнес йўналишлари кесимида. Йўналиш кўрсатилмаган сатрлар алоҳида устунга тушади; устунлар йиғиндиси оддий фойда-зарар ҳисоботига айнан тенг. Барча суммалар home валютада.
help.page.search.title=Глобал қидирув
help.page.search.body=Битта майдондан бутун тизимни қидириш: ҳужжат рақами, контакт, товар, счёт, экран ва ҳисобот номлари. Натижа босилса тегишли саҳифа очилади.
help.page.auditLog.title=Аудит журнали
help.page.auditLog.body=Тизимда ким, қачон, нима қилганининг ўзгармас журнали: ҳужжат амаллари, кириш уринишлари, фойдаланувчи бошқаруви. Ёзувлар ўчирилмайди ва таҳрирланмайди.
help.page.users.title=Фойдаланувчилар
help.page.users.body=Тизим фойдаланувчилари ва роллари: ADMIN ҳаммасини бошқаради, ACCOUNTANT ҳужжатлар билан ишлайди, VIEWER фақат кўради. Фойдаланувчи ўчирилмайди - фақат нофаол қилинади, аудит изи сақланади.
help.page.settings.title=Компания созламалари
help.page.settings.body=Асосий созламалар: ном, home валюта, вақт минтақаси, захира баҳолаш усули, молия йили, давр ёпилиши ва иш ҳақи ставкалари. Айрим қарорлар (home валюта, баҳолаш усули) биринчи ишлатишдан кейин қулфланади - уларни бошида тўғри танланг.
help.page.telegram.title=Telegram бот
help.page.telegram.body=Компаниянинг ўз Telegram боти: @BotFather да яратилади, токени шу ерга киритилади. Токен текширилиб (getMe) шифрланган ҳолда сақланади - экранда фақат маскаси кўринади, логга ва аудитга ёзилмайди. Бот уланганда фойдаланувчилар ўз профилидан Telegram ҳисобини улай олади. Токен ўчирилса бот узилади, лекин уланган фойдаланувчилар сақланади.
help.page.plugins.title=Плагинлар
help.page.plugins.body=Ихтиёрий фичалар реестри: плагин ёқилганда унинг менюси ва созламалари пайдо бўлади, ўчирилганда яширинади. Ўчириш плагин маълумотини ЎЧИРМАЙДИ - қайта ёқилса ҳаммаси тикланади. Ҳар toggle аудит журналига ёзилади.
help.page.profile.title=Профиль
help.page.profile.body=Ўз профилингиз: email, жинс, туғилган сана, телефон ва профиль расми (аватар). Бу маълумотлар ихтиёрий - login username ва парол ўзгармайди. Шу саҳифада паролни ҳам алмаштирасиз. Ҳар роль ўз профилини бошқаради.
help.page.company.title=Компания маълумотлари
help.page.company.body=Компаниянинг тўлиқ реквизитлари: юридик ном, манзил, СТИР/ИНН, банк, директор ва лого. Бу маълумотлар ҳужжат ва чоп сарлавҳасида ишлатилади. Асосий кўринадиган ном эса Созламалар саҳифасида.
help.page.taxRates.title=ҚҚС ставкалари
help.page.taxRates.body=Солиқ ставкалари каталоги. Ставка ҳужжат сатрида танланади ва қиймати сатрга ёзиб қўйилади - каталогда кейин ўзгартирилса тарихий ҳужжатлар ўзгармайди. Ставка ўчирилмайди - фақат нофаол қилинади.
help.page.paymentMethods.title=Тўлов усуллари
help.page.paymentMethods.body=Тўлов усуллари каталоги: нақд, банк ўтказмаси ва бошқалар. Ҳужжатларда белги сифатида танланади - бухгалтерияга таъсир қилмайди. Усул ўчирилмайди - фақат нофаол қилинади.
help.page.classes.title=Йўналишлар
help.page.classes.body=Даромад ва харажатни бизнес йўналишлари (бўлим, филиал, фаолият тури) кесимида кузатиш теглари. Суммаларга таъсир қилмайди - фақат фойда-зарар таҳлилини сегментлайди. Ўчириш йўқ - нофаол қилинади.
help.page.import.title=Excel орқали юклаш
help.page.import.body=Янги компания маълумотларини битта Excel файлдан юклаш: контактлар ва товарлар. Шаблонни юклаб олинг, тўлдиринг ва қайтариб юкланг. Базада мавжуд номлар ўтказиб юборилади, файл ичидаги такрор ном хато саналади.
help.page.factoryReset.title=Бошланғич ҳолатга қайтариш
help.page.factoryReset.body=Барча киритилган маълумотларни ўчириб, тизимни янги ўрнатилган ҳолатга келтиради. Демо ва синов маълумотларини тозалашда ишлатилади. Амал ортга қайтарилмайди - тасдиқлаш икки босқичли.
help.page.closingDate.title=Давр ёпилиш санаси
help.page.closingDate.body=Давр ёпиш - белгиланган санагача бўлган ҳисоб даврини қулфлаш: шу санага тенг ёки ундан олдинги санага янги проводка киритиб бўлмайди, ўтган давр ҳисоботлари ўзгармай туради. Ёпиқ даврдаги ҳужжатни тузатиш керак бўлса сторно очиқ давр санасида ёзилади. Бўш қолдирилса қулф йўқ. QuickBooks Online'даги «Китобни ёпиш» (Close the books) аналоги.
help.field.closingDate.title=Давр ёпилиш санаси
help.field.closingDate.body=Шу санага тенг ёки ундан олдинги санага янги проводка киритиб бўлмайди - ўтган даврлар ҳисоботлари ўзгармай туради. Ёпиқ даврдаги ҳужжатни тузатиш керак бўлса, сторно очиқ давр санасида ёзилади: ёпиқ давр қолдиқлари ўзгармайди, тузатиш ўз санасида акс этади. Бўш қолдирилса қулф йўқ. Санани суриш ёки олиб ташлаш мумкин.
help.field.companyLogo.title=Ҳужжат логоси
help.field.companyLogo.body=Ҳужжатлар ва ҳисоботлар чоп сарлавҳасида кўринади (масалан ҳисоб-фактура). Топбар бренди эмас - у алоҳида «Бренд логоси».
help.field.brandLogo.title=Бренд логоси
help.field.brandLogo.body=Тизим топбарида «AVERPO» ўрнига компаниянинг ўз бренди кўринади (white-label). Ҳужжат логосидан фарқли - бу фақат экран учун, ҳужжатларга тушмайди.
help.field.homeCurrency.title=Home валюта
help.field.homeCurrency.body=Бухгалтерия юритиладиган асосий валюта: барча проводкалар шу валютада балансланади, ҳисоботлар шу валютада чиқади. Биринчи тасдиқланган проводкадан кейин қулфланади ва бошқа ўзгартириб бўлмайди. Чет валютали ҳужжатлар курс орқали шу валютага айлантириб ёзилади.
help.field.valuationMethod.title=Захира баҳолаш усули
help.field.valuationMethod.body=Омбордан чиқаётган товар таннархи қандай ҳисобланишини белгилайди: AVCO - ўртача қиймат, FIFO - аввал кирган партия аввал чиқади. Ҳисоб товар ва омбор кесимида юритилади. Биринчи омбор ҳаракатидан кейин қулфланади - тарихни қайта ҳисоблаб бўлмайди.
help.field.payrollRates.title=Иш ҳақи ставкалари
help.field.payrollRates.body=Учта мустақил фоиз: даромад солиғи ва пенсия бадали ходим ойлигидан ушланади, ижтимоий солиқ иш берувчи устига тушади. Ҳисоблашда суммалар ҳужжатга ёзиб қўйилади - ставка кейин ўзгарса эски ҳисоблашлар ўзгармайди. Пенсия даромад солиғи ичида эмас, алоҳида ушланма - расмий талқин керак бўлса ставкаларни шунга мослаб созланг.
help.field.fiscalYearStart.title=Молия йили бошланиши
help.field.fiscalYearStart.body=Баланс ҳисоботидаги Тақсимланмаган фойда ва Соф фойда бўлиниши шу ойга қараб ҳисобланади. Исталган пайт ўзгартирса бўлади - фақат ҳисобот кўринишига таъсир қилади, сақланган маълумотга тегмайди.
help.field.timezone.title=Вақт минтақаси
help.field.timezone.body=Барча вақтлар базада UTC да сақланади, экранда шу минтақа вақтида кўрсатилади. Минтақани ўзгартириш сақланган маълумотга таъсир қилмайди - фақат кўрсатиш ўзгаради.
help.field.classTracking.title=Йўналиш кузатуви режими
help.field.classTracking.body=Ҳужжатларда йўналиш қандай танланишини белгилайди: ўчирилган, ҳар сатрда алоҳида ёки бутун ҳужжатга битта. Режим алмашганда эски ҳужжатлар ўзгармайди. Йўналиш суммаларга таъсир қилмайди - фақат таҳлилни сегментлайди.
help.field.exchangeRate.title=Валюта курси
help.field.exchangeRate.body=Ҳужжат санасидаги курс автоматик тўлдирилади, қўлда ўзгартириш мумкин. Курс ҳужжатга ёзиб қўйилади - кейин каталогда курс янгиланса бу ҳужжат ўзгармайди. Тўлов пайтидаги курс билан фарқ алоҳида курс фарқи проводкаси билан ёзилади.
help.field.vatMode.title=Суммалар ҚҚС билан ёки ҚҚСсиз
help.field.vatMode.body=Сатрдаги нархлар қандай киритилишини белгилайди: ҚҚСсиз режимда солиқ нарх устига қўшилади, ҚҚС билан режимида нарх ичидан ажратилади. Ҳар иккисида ҳужжат жамиси солиқ билан ҳисобланади. Ставка ҳар сатрда алоҳида танланади.
help.field.depositAccount.title=Қабул счёти
help.field.depositAccount.body=Тўлов тушадиган счёт: банк, касса ёки Тушумлар транзити. Транзит счёти ҳали банкка ўтказилмаган тушумлар учун - кейин банк кирими билан жамлаб ўтказилади. Чет валюта тўловлар транзит орқали қабул қилинади.
help.field.unitFactor.title=Бирлик коэффициенти
help.field.unitFactor.body=1 шу бирлик неча асосий бирликка тенглигини билдиради, масалан 1 қути = 12 дона. Ҳужжат сатрида миқдор киритилган бирликда сақланади, омборга асосий бирликда туширилади. Коэффициент сатрга ёзиб қўйилади - кейин ўзгартирилса тарихий ҳужжатлар ўзгармайди.
help.field.payrollPeriod.title=Ҳисоблаш ойи ва проводка санаси
help.field.payrollPeriod.body=Давр қайси ой учун ҳисоблаш эканини, проводка санаси бош дафтарга қайси кунда тушишини белгилайди. Сана айнан шу ой ичида бўлиши шарт - на олдинги, на кейинги ойга ўтмайди. Бир ойга биттагина тасдиқланган ҳисоблаш бўлади.
help.field.reconBalance.title=Кўчирма қолдиғи
help.field.reconBalance.body=Банк кўчирмасидаги давр якуний қолдиғи - солиштирувнинг мақсади шу рақамга айнан тушиш. Давр боши қолдиқ аввалги ёпилган солиштирувдан автоматик олинади, биринчисида қўлда киритилади. Белгиланган сатрлар билан фарқ нолга тушгандагина давр ёпилади.
help.field.openingBalance.title=Бошланғич қолдиқ
help.field.openingBalance.body=Тизимга ўтишда счётнинг мавжуд қолдиғи: қарши томон автоматик Очилиш қолдиқлари счётига ёзилади. Ҳар счётга бир марта киритилади; хато бўлса сторно қилиб қайта киритилади. Мижоз ва таъминотчи қарзлари бу ерда эмас - очиқ Invoice ва Bill ҳужжатлари орқали киритилади.
help.field.lcAllocation.title=Landed cost тақсимоти
help.field.lcAllocation.body=Киритилган сумма танланган киримларга қиймати бўйича пропорционал бўлинади. Ҳар кирим бўйича омборда қолган қисм захира қийматига қўшилади, сотилиб бўлган қисм таннархга ёзилади. Сумма клиринг счётида йиғилган харажатдан олинади - қолдиқ назорати қўлда.
help.field.creditApply.title=Кредитни қўллаш
help.field.creditApply.body=Кредит очиқ ҳужжатга қўлланганда унинг қолдиғи камаяди - пул ҳаракати бўлмайди, проводка ёзилмайди (фақат чет валютада курс фарқи бўлиши мумкин). Қўллаш фақат қўлда - қайси ҳужжатга қанча ёпилишини ўзингиз белгилайсиз. Қўлланган кредит сторно қилинмайди - аввал қўллаш бекор қилинади.
help.field.estimateExpiry.title=Таклиф амал муддати
help.field.estimateExpiry.body=Таклифдаги нарх мижоз учун қачонгача кучда туришини билдиради. Муддат ўтганда ҳужжат автоматик ёпилмайди - бу фақат маълумот белгиси. Майдон ихтиёрий.
help.field.paymentTerm.title=Тўлов шарти
help.field.paymentTerm.body=Контактга бириктирилган тўлов муддати, кун ҳисобида. Ҳужжатда тўлов санаси шу шартдан автоматик ҳисобланади - керак бўлса ҳужжатда қўлда ўзгартирилади. Муддати ўтган қарзлар таҳлил ҳисоботларида кечиккан гуруҳларга тушади.
help.field.agingBuckets.title=Муддат гуруҳлари
help.field.agingBuckets.body=Очиқ қарзлар тўлов санасидан ўтган кунларга қараб гуруҳланади: Жорий - муддати ҳали келмаган, кейин 1-30, 31-60, 61-90 ва 90+ кун кечиккан. Устун қанча ўнгда бўлса, қарз шунча эски.
help.field.runningBalance.title=Жорий қолдиқ устуни
help.field.runningBalance.body=Ҳар ҳаракатдан кейинги йиғилган қолдиқ: давр боши қарзга инвойслар қўшилиб, тўлов ва кредитлар айрилиб борилади. Охирги сатрдаги қиймат давр охири қолдиққа тенг.
help.field.allAmountsHome.title=Барча суммалар home валютада
help.field.allAmountsHome.body=Ҳисобот бош дафтардан ўқилади, у эса доим home валютада балансланади - шунинг учун ҳамма рақамлар home валютада. Чет валютали ҳужжатлар ўз курсида айлантирилган ҳолда ҳисобга кирган.
